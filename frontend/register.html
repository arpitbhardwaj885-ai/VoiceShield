<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Station Account — VoiceShield Defense Portal</title>
  <meta name="description" content="Register an analyst security station account on the VoiceShield speech defense network.">

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Decoupled Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Ambient Atmospheric Horizon Artwork -->
  <div class="cosmic-canvas" aria-hidden="true">
    <div class="aurora-glow-red"></div>
    <div class="aurora-glow-cyan"></div>
    <div class="celestial-eclipse"></div>
    <div class="water-reflection-plane"></div>
  </div>

  <!-- Top Minimalist Nav -->
  <nav class="navbar navbar-cinematic">
    <div class="container-fluid px-lg-5 d-flex justify-content-between align-items-center">
      <a class="brand-link" href="index.html">
        <span class="brand-glyph">✦</span>
        <span class="brand-title">VOICESHIELD</span>
      </a>

      <div class="nav-status-pill font-mono d-none d-sm-inline-flex">
        <span class="pulse-dot"></span>
        <span>Registry Gateway</span>
      </div>
    </div>
  </nav>

  <!-- Centered Registration Box -->
  <main class="auth-viewport">
    <div class="auth-card">
      
      <div class="auth-header">
        <div class="category-tag">
          <span>Station Onboarding</span>
        </div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Initialize an analyst profile for forensic verification</p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="authAlert" class="auth-alert" role="alert">
        <i class="fa-solid fa-circle-exclamation me-1"></i>
        <span id="authAlertText">Registration error</span>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" novalidate>
        
        <!-- Full Name -->
        <div class="form-group-custom">
          <div class="label-row">
            <label for="fullName" class="form-label-custom">Analyst Full Name</label>
          </div>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="fullName" 
              class="form-control-vs font-mono" 
              placeholder="Arpit" 
              required 
              autocomplete="name"
            >
            <i class="fa-solid fa-user input-icon-left"></i>
          </div>
        </div>

        <!-- Email Input -->
        <div class="form-group-custom">
          <div class="label-row">
            <label for="email" class="form-label-custom">Official Email</label>
          </div>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              class="form-control-vs font-mono" 
              placeholder="analyst@voiceshield.internal" 
              required 
              autocomplete="email"
            >
            <i class="fa-solid fa-envelope input-icon-left"></i>
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group-custom">
          <div class="label-row">
            <label for="password" class="form-label-custom">Passphrase (Min. 8 Chars)</label>
          </div>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              class="form-control-vs font-mono" 
              placeholder="••••••••••••" 
              required 
              autocomplete="new-password"
            >
            <i class="fa-solid fa-shield-halved input-icon-left"></i>
            <button 
              type="button" 
              class="toggle-pass-btn" 
              id="togglePasswordBtn" 
              aria-label="Toggle password visibility"
            >
              <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password Input -->
        <div class="form-group-custom">
          <div class="label-row">
            <label for="confirmPassword" class="form-label-custom">Confirm Passphrase</label>
          </div>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="confirmPassword" 
              class="form-control-vs font-mono" 
              placeholder="••••••••••••" 
              required 
              autocomplete="new-password"
            >
            <i class="fa-solid fa-lock input-icon-left"></i>
          </div>
        </div>

        <!-- Terms Agreement -->
        <div class="checkbox-row">
          <input type="checkbox" id="termsAgreement" required>
          <label for="termsAgreement">I agree to acoustic data governance and platform telemetry policies</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit-cinematic" id="submitBtn">
          <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          <span id="btnText">Provision Profile ➔</span>
        </button>

      </form>

      <div class="auth-footer">
        Already hold a verified credential? 
        <a href="login.html" class="auth-link-highlight">Sign In Station</a>
      </div>

    </div>
  </main>

  <!-- Minimalist Bottom Footer -->
  <footer class="footer-cinematic text-center">
    <div class="container font-mono">
      VoiceShield &copy; 2026. Built strictly for the SIH26104 Speech Security Architecture.
    </div>
  </footer>

  <!-- Bootstrap 5 JavaScript Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Core Scripts -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
